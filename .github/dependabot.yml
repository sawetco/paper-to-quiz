version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # WordPress Core supplies React 18 throughout the supported version matrix.
    ignore:
      - dependency-name: react
        versions: [">=19"]
      - dependency-name: react-dom
        versions: [">=19"]
      - dependency-name: '@types/react'
        versions: [">=19"]
      - dependency-name: '@types/react-dom'
        versions: [">=19"]
      - dependency-name: react-konva
        versions: [">=19"]
      # The retained WordPress Jest transformer uses the Babel 7 preset.
      - dependency-name: '@babel/core'
        versions: [">=8"]
      - dependency-name: '@wordpress/babel-preset-default'
        versions: [">=9"]
    groups:
      jest-tooling:
        update-types: [minor, patch]
        patterns:
          - jest
          - babel-jest
          - jest-environment-jsdom
      wordpress-tooling:
        update-types: [minor, patch]
        patterns:
          - '@wordpress/*'
      routine-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      routine-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      routine-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
