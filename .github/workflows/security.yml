name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  checks:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test automation safety policy
        run: node --test .github/automation/policy.test.cjs
      - name: Test parsed dependency policies
        run: python .github/automation/test-classifier.py
      - name: Test distribution safety and recovery
        run: python .github/automation/test-publication.py
      - name: Scan the tracked source snapshot for exposed credentials
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          mkdir "$RUNNER_TEMP/source-snapshot"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source-snapshot"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/source-snapshot" --config .gitleaks.toml --redact --no-banner
      - name: Scan authored source with local Semgrep rules
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.182.1
          semgrep scan --config .github/security-rules.yml --metrics=off --disable-version-check --error
