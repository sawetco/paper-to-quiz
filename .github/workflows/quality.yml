name: Quality

on:
  schedule:
    - cron: "17 2 * * 3"
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:audit -- --omit=dev
      - run: npm run security:audit
      - run: npm run check:release-metadata
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npx tsc --noEmit
      - run: npm run test:unit -- --runInBand
      - run: npm run build
      - run: npm run check:build-portability
      - run: npm run plugin-zip
      - name: Extract distribution
        run: unzip paper-to-quiz.zip -d plugin-check-build
      - name: Prepare isolated package check
        run: |
          node -e "const fs=require('node:fs'),path=require('node:path');fs.mkdirSync('.wp-env-home',{recursive:true});fs.writeFileSync('.wp-env-home/plugin-check.json',JSON.stringify({core:'WordPress/WordPress#7.1.3',phpVersion:'8.1',port:8894,testsEnvironment:false,plugins:[],mappings:{'wp-content/plugins/paper-to-quiz':path.resolve('plugin-check-build/paper-to-quiz')},config:{WP_ENVIRONMENT_TYPE:'local'}}));"
      - name: Run Plugin Check with locked tooling
        env:
          WP_ENV_HOME: ${{ github.workspace }}/.wp-env-home/plugin-check
        run: |
          npx wp-env --config .wp-env-home/plugin-check.json start
          npx wp-env --config .wp-env-home/plugin-check.json run cli wp plugin install plugin-check --activate
          npx wp-env --config .wp-env-home/plugin-check.json run cli wp plugin activate paper-to-quiz
          npx wp-env --config .wp-env-home/plugin-check.json run cli wp plugin check paper-to-quiz --slug=paper-to-quiz --format=json --require=./wp-content/plugins/plugin-check/cli.php > "$RUNNER_TEMP/plugin-check-results.json"
          cat "$RUNNER_TEMP/plugin-check-results.json"
          node -e "const fs=require('node:fs');const output=fs.readFileSync(process.env.RUNNER_TEMP+'/plugin-check-results.json','utf8').trim();if(output!=='Success: Checks complete. No errors found.'){const issues=JSON.parse(output);if(!Array.isArray(issues)||issues.length)process.exit(1);}"
      - if: always()
        name: Stop package check environment
        env:
          WP_ENV_HOME: ${{ github.workspace }}/.wp-env-home/plugin-check
        run: npx wp-env --config .wp-env-home/plugin-check.json stop
      - if: failure()
        name: Upload package check diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-check-results
          path: ${{ runner.temp }}/plugin-check-results.json
          if-no-files-found: ignore

      - name: Preserve the exact Plugin Check verified distribution ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: product-package
          path: paper-to-quiz.zip
          if-no-files-found: error
          retention-days: 14

  php-syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.3", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

  php-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run env:start
      - run: npm run env:install
      - run: npm run test:php
      - name: Verify ranking without optional mbstring case conversion
        run: npx wp-env run cli php -d disable_functions=mb_strtolower wp-content/plugins/paper-to-quiz/vendor/bin/phpunit -c wp-content/plugins/paper-to-quiz/phpunit.xml.dist --filter RankingTest
      - if: always()
        name: Stop wp-env
        run: npm run env:stop
      - if: failure()
        name: Upload wp-env logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wp-env-logs-phpunit
          path: |
            ~/.wp-env/**/logs/**
            ~/.npm/_logs/**
          if-no-files-found: ignore

  compatibility:
    needs: [javascript, php-syntax]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wp71, wp68]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node build-tools/run-wp-env-suite.js ${{ matrix.target }} integration
      - run: node build-tools/run-wp-env-suite.js ${{ matrix.target }} e2e
      - if: failure()
        name: Upload wp-env and browser logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ matrix.target }}-logs
          path: |
            .wp-env-home/**/logs/**
            ~/.npm/_logs/**
            test-results/**
            playwright-report/**
          if-no-files-found: ignore

  package-upgrade:
    name: Package install and upgrade
    needs: javascript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: product-package
          path: .package-under-test
      - name: Download and verify the immutable upgrade baseline
        run: |
          curl --fail --silent --show-error --location https://github.com/sawetco/paper-to-quiz/releases/download/v1.1.6/paper-to-quiz.zip --output .package-under-test/baseline.zip
          echo '67ae6d92e008f25b40d2efa5b6744692a91c4ecd4a62b09a35e9f734672e48c0  .package-under-test/baseline.zip' | sha256sum --check
      - run: node .github/automation/test-package.cjs

  readiness:
    name: Release readiness
    needs: [javascript, php-syntax, php-unit, compatibility, package-upgrade]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const n=JSON.parse(process.env.RESULTS);if(Object.values(n).some(j=>j.result!=="success"))process.exit(1)'
