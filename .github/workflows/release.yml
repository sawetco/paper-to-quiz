name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  release:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:audit -- --omit=dev
      - run: npm run security:audit
      - run: npm run check:release-metadata -- --tag "$GITHUB_REF_NAME"
      - run: npm run build
      - run: npm run check:build-portability
      - run: npm run plugin-zip
      - name: Publish WordPress package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" paper-to-quiz.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" paper-to-quiz.zip \
              --verify-tag \
              --generate-notes \
              --title "Paper to Quiz ${GITHUB_REF_NAME#v}"
          fi
