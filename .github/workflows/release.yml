name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/draft" 2>/dev/null; then
            if grep -q false "$RUNNER_TEMP/draft"; then echo 'publish=false' >> "$GITHUB_OUTPUT"; else echo 'publish=true' >> "$GITHUB_OUTPUT"; fi
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
  quality:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
  publish:
    needs: [prepare, quality]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
      checks: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install and verify the WordPress SVN client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends subversion
          svn --version --quiet
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: product-package
          path: .
      - name: Verify the exact source security result before publication
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const result = await github.rest.checks.listForRef({...context.repo, ref:context.sha, per_page:100});
            for(const name of ['Security checks','Analyze (javascript-typescript)','Analyze (actions)']){
              const checks=result.data.check_runs.filter(c=>c.name===name&&c.app?.slug==='github-actions').sort((a,b)=>b.id-a.id);
              if(checks[0]?.conclusion!=='success')throw Error('The exact release source must pass '+name);
            }
      - name: Create an immutable source tag and draft release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          fi
          asset="paper-to-quiz.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir "$RUNNER_TEMP/existing"
            if gh release download "$tag" --pattern "$asset" --dir "$RUNNER_TEMP/existing"; then
              python -c 'import zipfile,hashlib,sys; m=lambda p:{n:hashlib.sha256(z.read(n)).hexdigest() for z in [zipfile.ZipFile(p)] for n in z.namelist() if not n.endswith("/")}; assert m(sys.argv[1])==m(sys.argv[2]),"Existing release artifact differs"' "$asset" "$RUNNER_TEMP/existing/$asset"
              cp "$RUNNER_TEMP/existing/$asset" "$asset"
            else gh release upload "$tag" "$asset"; fi
          else
            gh release create "$tag" "$asset" --verify-tag --draft --generate-notes --title "$tag"
          fi
      - name: Attest the tested distribution archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: "*.zip"
      - name: Publish the same archive to WordPress.org and verify served files
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: python .github/automation/publish-wordpress.py
      - name: Preserve the verified WordPress publication evidence
        run: |
          sha256sum paper-to-quiz.zip > SHA256SUMS
          gh release upload "v$RELEASE_VERSION" wordpress-release-manifest.json SHA256SUMS --clobber
      - name: Publish the completed GitHub release
        run: gh release edit "v$RELEASE_VERSION" --draft=false --latest
